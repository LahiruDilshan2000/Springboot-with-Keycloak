server:
  port: 8080
spring:
  profiles:
    active: dev
  datasource:
    password: 1234
    url: jdbc:postgresql://localhost:5432/book-shop
    username: user
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "http://localhost:9098/realms/book-shop"

